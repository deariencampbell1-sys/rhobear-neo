name: Validate Neo surface manifest

on:
  pull_request:
    paths:
      - '.rhobear/surfaces/**'
      - 'tests/test_surface_manifest.py'
      - '.github/workflows/validate-surface-manifest.yml'
  push:
    branches: [main]
    paths:
      - '.rhobear/surfaces/**'
      - 'tests/test_surface_manifest.py'
      - '.github/workflows/validate-surface-manifest.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest tests/test_surface_manifest.py -v
